# Tests on GPU back-ends. The CPU tests on GitHub Actions cover the rest. Each step selects its
# array back-end with WATERLILY_BACKENDS (see test/runtests.jl), which installs the GPU package
# on demand. Metal has no Float64 support, so only the "float32" test set runs on it.
# Draft pull requests skip them, unless selected by name in the last commit message:
# `[only cuda]`, `[only amdgpu, metal]` or `[only tests]` for all of them. `[skip metal]`
# or `[skip tests]` does the opposite.
# As on GitHub Actions, they also only run when the source, tests or CI files change
# (`if_changed`). Tag, manual and scheduled builds run them regardless (see hooks/pre-command).

# Path groups for `if_changed`
paths:
  buildkite:     &buildkite_paths      ".buildkite/{pipeline.yml,hooks/**}"
  code:          &code_paths           "{ext,src}/**"
  project:       &project_paths        "Project.toml"
  tests:         &test_paths           "test/**"

steps:

  # CUDA
  - label: "CUDA - Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.11"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-test#v1: ~
    agents:
      queue: "cuda"
    if_changed: [*buildkite_paths, *code_paths, *project_paths, *test_paths]
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
      (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    env:
      WATERLILY_BACKENDS: "cuda"

  # AMDGPU
  - label: "AMDGPU - Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.11"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-test#v1: ~
    agents:
      queue: "rocm"
      rocmgpu: "*"
    if_changed: [*buildkite_paths, *code_paths, *project_paths, *test_paths]
    if: |
      build.message !~ /\[skip [^\]]*(tests|amdgpu)/ &&
      (build.message =~ /\[only [^\]]*(tests|amdgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    env:
      WATERLILY_BACKENDS: "amdgpu"

  # Metal
  - label: "Metal - Julia {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.11"
          - "1.13"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-test#v1:
          test_args: "float32"
    agents:
      queue: "metal"
    if_changed: [*buildkite_paths, *code_paths, *project_paths, *test_paths]
    if: |
      build.message !~ /\[skip [^\]]*(tests|metal)/ &&
      (build.message =~ /\[only [^\]]*(tests|metal)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    env:
      WATERLILY_BACKENDS: "metal"
