name: Benchmark

# On-demand benchmarks of a pull request against master with WaterLily-Benchmarks: a maintainer comments `/benchmark`,
# optionally followed by benchmark.sh arguments (e.g. `/benchmark -c "tgv sphere" -r 3`), or runs it from the Actions
# tab. Default: tgv and jelly-biotsavart on CPUx01 and CPUx02, 2 repetitions; the report is a PR comment that later
# runs update. This file always comes from master, but the PR code does run: read the diff first.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      args:
        description: benchmark.sh arguments (empty means the default)
        default: ""
        type: string

permissions:
  contents: read
  issues: write         # reaction
  pull-requests: write  # report comment

# One benchmark per PR at a time. A group keeps a single pending run and cancels the older one, and every comment
# starts a run, so only requests that the job runs share a group: another comment cannot replace a pending request.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
    (github.event.issue.pull_request && startsWith(github.event.comment.body, '/benchmark') &&
    contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    && format('benchmark-{0}', github.event.issue.number || inputs.pr) || format('ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/benchmark') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve the PR and the arguments
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || inputs.pr }}
          REQUEST: ${{ github.event.comment.body || inputs.args }}
        run: |
          args=${REQUEST%%$'\n'*}; args=${args#/benchmark}  # first line, command removed
          [[ $args =~ ^[A-Za-z0-9\ ,._=\"-]*$ ]] || { echo "::error::unexpected characters in the arguments: $args"; exit 1; }
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Acknowledge the request
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket

      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Fetch the PR head as pr-${{ steps.pr.outputs.number }}
        run: git fetch origin "pull/${{ steps.pr.outputs.number }}/head:pr-${{ steps.pr.outputs.number }}"

      - name: Benchmark master vs the PR
        uses: WaterLily-jl/WaterLily-Benchmarks@main
        with:
          base: master
          head: pr-${{ steps.pr.outputs.number }}
          args: ${{ steps.pr.outputs.args }}
          pr: ${{ steps.pr.outputs.number }}
          artifact: benchmark-pr-${{ steps.pr.outputs.number }}

      - name: Report a failed run
        if: failure() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${{ steps.pr.outputs.number }}/comments"
          -f body="The benchmark run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
